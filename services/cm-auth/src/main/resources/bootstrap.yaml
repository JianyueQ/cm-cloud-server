server:
  port: 8081
spring:
  application:
    name: cm-auth
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.127.140:8848
        namespace: dev
      config:
        server-addr: 192.168.127.140:8848
        namespace: dev
  config:
    import:
      - nacos:cm-auth.yaml?group=auth

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.cm.entity
  configuration:
    map-underscore-to-camel-case: true

