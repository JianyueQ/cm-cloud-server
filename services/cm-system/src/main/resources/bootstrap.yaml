server:
  port: 8082
spring:
  application:
    name: cm-system
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.127.140:8848
        namespace: dev
      config:
        server-addr: 192.168.127.140:8848
        namespace: dev
  config:
    import:
      - nacos:cm-system.yaml?group=system

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.cm.entity
  configuration:
    map-underscore-to-camel-case: true
logging:
  level:
    com.cm.api: debug
